<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>THE SPIRAL — SCANNER</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Share Tech Mono',monospace; }

/* ── SPLASH ── */
#splash {
  position:fixed; inset:0;
  background:radial-gradient(ellipse at center, #000a14, #000005);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:30px; text-align:center; z-index:9999;
  transition:opacity 1s;
}
#splash.hide { opacity:0; pointer-events:none; }
.s-title { color:#00ffaa; font-size:1.5rem; letter-spacing:0.38em; text-shadow:0 0 20px #00ffaa; }
.s-ring {
  width:50px; height:50px; border:2px solid transparent;
  border-top-color:#00ffaa; border-right-color:#00aaff;
  border-radius:50%; animation:spin 1.1s linear infinite;
}
.s-sub { color:#007755; font-size:0.65rem; letter-spacing:0.14em; line-height:2; }

/* ── SCANNER LAYER — sits over camera, under A-Frame ── */
#scanner {
  position:fixed; inset:0; z-index:5;
  pointer-events:none;
  display:none;
  transition:opacity 0.6s;
}
#scanner.hidden { opacity:0; }

/* Grid overlay */
#grid-canvas {
  position:absolute; inset:0; width:100%; height:100%;
}

/* Horizontal scan line */
#scanline {
  position:absolute; left:0; right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, #00ffaa80, #00ffaaff, #00ffaa80, transparent);
  box-shadow:0 0 12px #00ffaa, 0 0 4px #00ffaa;
  animation:scanMove 2.8s ease-in-out infinite;
}

/* Radar sweep — canvas */
#radar-canvas {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  opacity:0.55;
}

/* Corner brackets */
.bracket {
  position:absolute; width:32px; height:32px;
  border-color:#00ffaa; border-style:solid;
}
.b-tl { top:18px; left:18px; border-width:2px 0 0 2px; }
.b-tr { top:18px; right:18px; border-width:2px 2px 0 0; }
.b-bl { bottom:18px; left:18px; border-width:0 0 2px 2px; }
.b-br { bottom:18px; right:18px; border-width:0 2px 2px 0; }

/* Scan readout text */
#scan-text {
  position:absolute; top:26px; left:50%; transform:translateX(-50%);
  font-size:0.58rem; letter-spacing:0.3em; color:rgba(0,255,170,0.6);
  white-space:nowrap; animation:textPulse 1.4s ease-in-out infinite;
}
#scan-pct {
  position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
  font-size:0.6rem; letter-spacing:0.2em; color:#00ffaa;
  background:rgba(0,17,10,0.85); border:1px solid rgba(0,255,170,0.2);
  padding:6px 20px; border-radius:2px; white-space:nowrap;
}

/* Lock flash overlay */
#lock-flash {
  position:fixed; inset:0; z-index:6;
  background:rgba(0,255,170,0.15);
  pointer-events:none; opacity:0;
  transition:opacity 0.1s;
}

/* HUD — shown after lock */
#hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
.corner { position:absolute; width:22px; height:22px; border-color:rgba(0,255,170,0.35); border-style:solid; }
.ctl { top:14px; left:14px; border-width:1px 0 0 1px; }
.ctr { top:14px; right:14px; border-width:1px 1px 0 0; }
.cbl { bottom:14px; left:14px; border-width:0 0 1px 1px; }
.cbr { bottom:14px; right:14px; border-width:0 1px 1px 0; }
#hud-top {
  position:absolute; top:18px; left:50%; transform:translateX(-50%);
  font-size:0.55rem; letter-spacing:0.3em; color:rgba(0,255,170,0.38); white-space:nowrap;
}
#hud-status {
  position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  font-size:0.62rem; letter-spacing:0.15em; color:#00ffaa;
  text-shadow:0 0 10px rgba(0,255,170,0.6);
  background:rgba(0,17,10,0.9); border:1px solid rgba(0,255,170,0.2);
  padding:7px 22px; border-radius:2px; white-space:nowrap; transition:color 0.4s;
}

/* Scanlines texture */
#scanlines {
  position:fixed; inset:0; z-index:8; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
}

@keyframes spin { to { transform:rotate(360deg); } }
@keyframes scanMove {
  0%   { top:0%; }
  50%  { top:calc(100% - 2px); }
  100% { top:0%; }
}
@keyframes textPulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="s-title">THE SPIRAL</div>
  <div class="s-ring"></div>
  <div class="s-sub">SCANNER INITIALISING<br>POINT AT YOUR DOOR<br>SYSTEM WILL LOCK AUTOMATICALLY</div>
</div>

<!-- SCANNER LAYER -->
<div id="scanner">
  <canvas id="grid-canvas"></canvas>
  <div id="scanline"></div>
  <canvas id="radar-canvas" width="220" height="220"></canvas>
  <div class="bracket b-tl"></div>
  <div class="bracket b-tr"></div>
  <div class="bracket b-bl"></div>
  <div class="bracket b-br"></div>
  <div id="scan-text">SCANNING ENVIRONMENT...</div>
  <div id="scan-pct">SEARCHING FOR MARKER</div>
</div>

<!-- Lock flash -->
<div id="lock-flash"></div>

<!-- Scanlines -->
<div id="scanlines"></div>

<!-- HUD -->
<div id="hud">
  <div class="corner ctl"></div>
  <div class="corner ctr"></div>
  <div class="corner cbl"></div>
  <div class="corner cbr"></div>
  <div id="hud-top">SPIRAL PROJECT · PORTSMOUTH</div>
  <div id="hud-status">SPIRAL LOCKED</div>
</div>

<!-- ══════════════════════════════════════
     A-FRAME SCENE
     ══════════════════════════════════════ -->
<a-scene
  mindar-image="imageTargetSrc:./targets.mind; autoStart:true; uiLoading:no; uiError:no; uiScanning:no;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0" id="anchor">

    <!-- Base glow ring -->
    <a-torus position="0 0 0" rotation="90 0 0" radius="0.12" radius-tubular="0.004"
      color="#00ffaa" material="emissive:#00ffaa;emissiveIntensity:2.5;transparent:true;opacity:0.55"
      animation="property:rotation;from:90 0 0;to:90 360 0;loop:true;dur:5000;easing:linear">
    </a-torus>

    <!-- Seed sphere -->
    <a-sphere position="0 0 0.01" radius="0.012" color="#ffffff"
      material="emissive:#ffffff;emissiveIntensity:6;transparent:true;opacity:0.95"
      animation="property:scale;from:1 1 1;to:1.5 1.5 1.5;loop:true;dur:1100;dir:alternate;easing:easeInOutSine">
    </a-sphere>

    <!-- Spiral root — rotates -->
    <a-entity animation="property:rotation;from:0 0 0;to:0 360 0;loop:true;dur:18000;easing:linear">

      <!-- ARM CYAN -->
      <a-entity rotation="0 0 0">
        <a-torus position="0.016 0 0"    radius="0.016" radius-tubular="0.003"  color="#00ffee" material="emissive:#00ffee;emissiveIntensity:4"   rotation="90 0 0"></a-torus>
        <a-torus position="0.040 0.018 0" radius="0.028" radius-tubular="0.0025" color="#00ffcc" material="emissive:#00ffcc;emissiveIntensity:3"   rotation="90 0 20"></a-torus>
        <a-torus position="0.072 0.044 0" radius="0.046" radius-tubular="0.002"  color="#00ffaa" material="emissive:#00ffaa;emissiveIntensity:2.5" rotation="90 0 38"></a-torus>
        <a-torus position="0.116 0.072 0" radius="0.074" radius-tubular="0.0015" color="#00ee99" material="emissive:#00ee99;emissiveIntensity:2"   rotation="90 0 55"></a-torus>
      </a-entity>

      <!-- ARM GOLD -->
      <a-entity rotation="0 90 0">
        <a-torus position="0.016 0 0"    radius="0.016" radius-tubular="0.003"  color="#ffee00" material="emissive:#ffee00;emissiveIntensity:4"   rotation="90 0 0"></a-torus>
        <a-torus position="0.040 0.018 0" radius="0.028" radius-tubular="0.0025" color="#ffcc00" material="emissive:#ffcc00;emissiveIntensity:3"   rotation="90 0 20"></a-torus>
        <a-torus position="0.072 0.044 0" radius="0.046" radius-tubular="0.002"  color="#ffaa00" material="emissive:#ffaa00;emissiveIntensity:2.5" rotation="90 0 38"></a-torus>
        <a-torus position="0.116 0.072 0" radius="0.074" radius-tubular="0.0015" color="#ff8800" material="emissive:#ff8800;emissiveIntensity:2"   rotation="90 0 55"></a-torus>
      </a-entity>

      <!-- ARM MAGENTA -->
      <a-entity rotation="0 180 0">
        <a-torus position="0.016 0 0"    radius="0.016" radius-tubular="0.003"  color="#ff00ff" material="emissive:#ff00ff;emissiveIntensity:4"   rotation="90 0 0"></a-torus>
        <a-torus position="0.040 0.018 0" radius="0.028" radius-tubular="0.0025" color="#ee00dd" material="emissive:#ee00dd;emissiveIntensity:3"   rotation="90 0 20"></a-torus>
        <a-torus position="0.072 0.044 0" radius="0.046" radius-tubular="0.002"  color="#cc00bb" material="emissive:#cc00bb;emissiveIntensity:2.5" rotation="90 0 38"></a-torus>
        <a-torus position="0.116 0.072 0" radius="0.074" radius-tubular="0.0015" color="#aa0099" material="emissive:#aa0099;emissiveIntensity:2"   rotation="90 0 55"></a-torus>
      </a-entity>

      <!-- ARM BLUE -->
      <a-entity rotation="0 270 0">
        <a-torus position="0.016 0 0"    radius="0.016" radius-tubular="0.003"  color="#00aaff" material="emissive:#00aaff;emissiveIntensity:4"   rotation="90 0 0"></a-torus>
        <a-torus position="0.040 0.018 0" radius="0.028" radius-tubular="0.0025" color="#0088ee" material="emissive:#0088ee;emissiveIntensity:3"   rotation="90 0 20"></a-torus>
        <a-torus position="0.072 0.044 0" radius="0.046" radius-tubular="0.002"  color="#0066dd" material="emissive:#0066dd;emissiveIntensity:2.5" rotation="90 0 38"></a-torus>
        <a-torus position="0.116 0.072 0" radius="0.074" radius-tubular="0.0015" color="#0055cc" material="emissive:#0055cc;emissiveIntensity:2"   rotation="90 0 55"></a-torus>
      </a-entity>

    </a-entity>

    <!-- Light pillar -->
    <a-cylinder position="0 0.2 0" radius="0.004" height="0.4"
      color="#00ffaa" material="emissive:#00ffaa;emissiveIntensity:2;transparent:true;opacity:0.18;side:double"
      animation="property:material.opacity;from:0.05;to:0.28;loop:true;dur:2200;dir:alternate;easing:easeInOutSine">
    </a-cylinder>

    <!-- φ symbol -->
    <a-text value="φ" position="0 0.38 0" align="center" color="#00ffaa" width="0.4"
      animation="property:position;from:0 0.35 0;to:0 0.42 0;loop:true;dur:3200;dir:alternate;easing:easeInOutSine">
    </a-text>

  </a-entity>
</a-scene>

<script>
// ═══════════════════════════════════════════════════════
//  SCANNER ENGINE
//  Three simultaneous effects:
//  1. Horizontal scanline (CSS animation)
//  2. Radar sweep (canvas, rotating beam)
//  3. Grid overlay (canvas, animated nodes)
// ═══════════════════════════════════════════════════════

const scanner   = document.getElementById('scanner');
const lockFlash = document.getElementById('lock-flash');
const hud       = document.getElementById('hud');
const scanPct   = document.getElementById('scan-pct');
const scanText  = document.getElementById('scan-text');

let radarAngle  = 0;
let scanTick    = 0;
let scanning    = true;
let fake_pct    = 0;

// ── Grid canvas ───────────────────────────────────────
const gridCanvas = document.getElementById('grid-canvas');
const gCtx       = gridCanvas.getContext('2d');

function resizeGridCanvas() {
  gridCanvas.width  = window.innerWidth;
  gridCanvas.height = window.innerHeight;
}
resizeGridCanvas();
window.addEventListener('resize', resizeGridCanvas);

function drawGrid() {
  const W = gridCanvas.width, H = gridCanvas.height;
  gCtx.clearRect(0, 0, W, H);

  const cols = 10, rows = 16;
  const cw   = W / cols, ch = H / rows;

  gCtx.strokeStyle = `rgba(0,255,170,${0.04 + 0.02 * Math.sin(scanTick * 0.5)})`;
  gCtx.lineWidth   = 0.5;

  // Vertical lines
  for (let c = 0; c <= cols; c++) {
    gCtx.beginPath();
    gCtx.moveTo(c * cw, 0);
    gCtx.lineTo(c * cw, H);
    gCtx.stroke();
  }
  // Horizontal lines
  for (let r = 0; r <= rows; r++) {
    gCtx.beginPath();
    gCtx.moveTo(0, r * ch);
    gCtx.lineTo(W, r * ch);
    gCtx.stroke();
  }

  // Animated node dots at intersections
  for (let c = 0; c <= cols; c++) {
    for (let r = 0; r <= rows; r++) {
      const pulse = Math.sin(scanTick * 1.2 + c * 0.7 + r * 0.5);
      if (pulse > 0.6) {
        const alpha = (pulse - 0.6) / 0.4 * 0.7;
        gCtx.fillStyle = `rgba(0,255,170,${alpha})`;
        gCtx.beginPath();
        gCtx.arc(c * cw, r * ch, 2, 0, Math.PI * 2);
        gCtx.fill();
      }
    }
  }
}

// ── Radar sweep canvas ────────────────────────────────
const radarCanvas = document.getElementById('radar-canvas');
const rCtx        = radarCanvas.getContext('2d');
const RAD_SIZE    = 110; // radius

function positionRadar() {
  radarCanvas.style.marginLeft = `-${RAD_SIZE}px`;
  radarCanvas.style.marginTop  = `-${RAD_SIZE}px`;
}
positionRadar();

function drawRadar() {
  rCtx.clearRect(0, 0, 220, 220);
  const cx = 110, cy = 110;

  // Outer rings
  [1, 0.66, 0.33].forEach(r => {
    rCtx.beginPath();
    rCtx.arc(cx, cy, RAD_SIZE * r, 0, Math.PI * 2);
    rCtx.strokeStyle = `rgba(0,255,170,${0.15 + 0.05 * Math.sin(scanTick)})`;
    rCtx.lineWidth = 0.8;
    rCtx.stroke();
  });

  // Cross hairs
  rCtx.strokeStyle = 'rgba(0,255,170,0.12)';
  rCtx.lineWidth = 0.5;
  rCtx.beginPath(); rCtx.moveTo(cx - RAD_SIZE, cy); rCtx.lineTo(cx + RAD_SIZE, cy); rCtx.stroke();
  rCtx.beginPath(); rCtx.moveTo(cx, cy - RAD_SIZE); rCtx.lineTo(cx, cy + RAD_SIZE); rCtx.stroke();

  // Sweep beam — trailing gradient
  const trailLen = Math.PI * 0.7;
  const grad = rCtx.createConicalGradient
    ? null  // not standard — use manual approach below
    : null;

  // Manual sweep trail
  const steps = 40;
  for (let i = 0; i < steps; i++) {
    const a     = radarAngle - (trailLen * i / steps);
    const alpha = (1 - i / steps) * 0.35;
    rCtx.beginPath();
    rCtx.moveTo(cx, cy);
    rCtx.arc(cx, cy, RAD_SIZE, a, a + trailLen / steps);
    rCtx.closePath();
    rCtx.fillStyle = `rgba(0,255,170,${alpha})`;
    rCtx.fill();
  }

  // Leading edge bright line
  rCtx.beginPath();
  rCtx.moveTo(cx, cy);
  rCtx.lineTo(cx + Math.cos(radarAngle) * RAD_SIZE, cy + Math.sin(radarAngle) * RAD_SIZE);
  rCtx.strokeStyle = 'rgba(0,255,170,0.9)';
  rCtx.lineWidth = 1.5;
  rCtx.stroke();

  // Blip dots — random targets that pulse
  const blips = [
    { a: 0.8,  r: 0.5 },
    { a: 2.1,  r: 0.75 },
    { a: 4.4,  r: 0.4 },
    { a: 5.2,  r: 0.8 },
  ];
  blips.forEach(b => {
    const diff = ((radarAngle - b.a) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    if (diff < trailLen) {
      const bx = cx + Math.cos(b.a) * RAD_SIZE * b.r;
      const by = cy + Math.sin(b.a) * RAD_SIZE * b.r;
      const ba = 1 - diff / trailLen;
      rCtx.beginPath();
      rCtx.arc(bx, by, 3, 0, Math.PI * 2);
      rCtx.fillStyle = `rgba(0,255,170,${ba * 0.9})`;
      rCtx.fill();
      rCtx.beginPath();
      rCtx.arc(bx, by, 6, 0, Math.PI * 2);
      rCtx.fillStyle = `rgba(0,255,170,${ba * 0.2})`;
      rCtx.fill();
    }
  });
}

// ── Fake scanning percentage ──────────────────────────
const scanMessages = [
  'SCANNING ENVIRONMENT...',
  'ANALYSING GEOMETRY...',
  'MAPPING FEATURE POINTS...',
  'CALIBRATING SENSOR...',
  'TRACKING SURFACE...',
  'AWAITING TARGET LOCK...',
];
let msgIdx = 0;

function updateScanText() {
  if (!scanning) return;
  fake_pct = Math.min(99, fake_pct + Math.random() * 3);
  scanPct.textContent = `SCAN ${Math.floor(fake_pct)}%  ·  SEARCHING`;
  if (Math.random() < 0.04) {
    msgIdx = (msgIdx + 1) % scanMessages.length;
    scanText.textContent = scanMessages[msgIdx];
  }
}

// ── Main scanner loop ─────────────────────────────────
function scanLoop() {
  if (!scanning) return;
  scanTick += 0.04;
  radarAngle = (radarAngle + 0.04) % (Math.PI * 2);
  drawGrid();
  drawRadar();
  updateScanText();
  requestAnimationFrame(scanLoop);
}

// ── A-Frame events ────────────────────────────────────
document.querySelector('a-scene').addEventListener('loaded', () => {
  setTimeout(() => {
    const s = document.getElementById('splash');
    s.classList.add('hide');
    setTimeout(() => {
      s.style.display = 'none';
      scanner.style.display = 'block';
      scanLoop();
    }, 1000);
  }, 1200);
});

document.querySelector('[mindar-image-target]').addEventListener('targetFound', () => {
  // ── LOCK ON ──
  scanning = false;

  // Flash the screen
  lockFlash.style.opacity = '1';
  setTimeout(() => lockFlash.style.opacity = '0', 180);
  setTimeout(() => { lockFlash.style.opacity = '0.5'; }, 220);
  setTimeout(() => { lockFlash.style.opacity = '0'; }, 380);

  // Fade scanner out
  scanner.classList.add('hidden');
  setTimeout(() => { scanner.style.display = 'none'; }, 700);

  // Show HUD
  setTimeout(() => {
    hud.style.display = 'block';
    document.getElementById('hud-status').textContent = '✦ SPIRAL LOCKED ✦';
    setTimeout(() => {
      document.getElementById('hud-status').textContent = 'SPIRAL PROJECT · LOCKED';
    }, 3000);
  }, 400);
});

document.querySelector('[mindar-image-target]').addEventListener('targetLost', () => {
  // Resume scanning
  scanning = true;
  fake_pct = 60;
  hud.style.display = 'none';
  scanner.style.display = 'block';
  scanner.classList.remove('hidden');
  scanLoop();

  document.getElementById('hud-status').style.color = '#ff4400';
  document.getElementById('hud-status').textContent = 'MARKER LOST — RESCANNING...';
  scanText.textContent = 'TARGET LOST — RESCANNING...';
  scanPct.textContent  = 'SEARCHING FOR MARKER';
});
</script>

</body>
</html>
